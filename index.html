<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dr. Arthur Furst | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1c79a2;
      --bg: #f5f5f0;
      --text: #211f1b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    main {
      max-width: 36rem;
      border-top: 3px solid var(--blue);
      padding-top: 2.5rem;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(2.5rem, 7vw, 4rem);
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 1.125rem;
      line-height: 1.6;
    }
    p + p { margin-top: 0.5rem; color: var(--blue); }
  </style>
</head>
<body>
  <main>
    <h1>Dr. Arthur Furst</h1>
    <p>This site is being updated.</p>
    <p>Please check back soon.</p>
  </main>
</body>
</html>
